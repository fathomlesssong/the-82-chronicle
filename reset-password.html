<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Nowe hasło • Kronika 82</title>

  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg?v=1">
  <link rel="stylesheet" href="/styles.css?v=8">
  <link rel="stylesheet" href="/mobile.css?v=9">
  <link rel="stylesheet" href="/front-final.css?v=27">
  <link rel="stylesheet" href="/admin-dashboard.css?v=3">
</head>

<body>
  <div class="page admin-page">

    <header class="masthead-wrap admin-masthead">
      <h1 class="masthead">Redakcja</h1>
      <p class="tagline">Ustawienie nowego hasła</p>
    </header>

    <main>
      <section class="admin-card">
        <h2>Nowe hasło</h2>

        <p class="admin-help" data-reset-help>
          Sprawdzanie linku odzyskiwania…
        </p>

        <form class="admin-form" data-reset-form hidden>
          <label>
            Nowe hasło
            <input
              type="password"
              name="password"
              autocomplete="new-password"
              minlength="10"
              required
            >
          </label>

          <label>
            Powtórz hasło
            <input
              type="password"
              name="password_confirm"
              autocomplete="new-password"
              minlength="10"
              required
            >
          </label>

          <button type="submit">Ustaw nowe hasło</button>
        </form>

        <p
          class="admin-status"
          data-reset-status
          role="status"
          aria-live="polite"
        ></p>

        <p class="admin-help">
          <a href="/admin.html">← Wróć do logowania</a>
        </p>
      </section>
    </main>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/supabase-config.js?v=1"></script>
  <script src="/reset-password.js?v=1"></script>
</body>
</html>
