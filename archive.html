<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Przekierowanie • The 82 Chronicle</title>
</head>
<body>
  <p>Przenoszenie do właściwego działu…</p>
  <script>
    const allowedSections=new Set(['aktualnosci','infrastruktura','sledztwa','kultura','kacik-kulinarny']);
    const section=(new URLSearchParams(location.search).get('section')||'').toLowerCase();
    location.replace(allowedSections.has(section)?`/section.html?section=${encodeURIComponent(section)}`:'/');
  </script>
  <noscript><a href="/">Przejdź na stronę główną</a></noscript>
</body>
</html>
