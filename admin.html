<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Redakcja • The 82 Chronicle</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png?v=4">
  <link rel="stylesheet" href="/styles.css?v=2">
</head>
<body>
  <div class="page admin-page">
    <header class="masthead-wrap admin-masthead">
      <a class="admin-back" href="/">← The 82 Chronicle</a>
      <h1 class="masthead">Redakcja</h1>
      <p class="tagline">Panel publikacji</p>
    </header>

    <main>
      <section class="admin-card" data-login-panel>
        <h2>Logowanie</h2>
        <p class="admin-help">Panel jest dostępny wyłącznie dla kont redakcyjnych.</p>
        <form class="admin-form" data-login-form>
          <label>E-mail<input type="email" name="email" autocomplete="email" required></label>
          <label>Hasło<input type="password" name="password" autocomplete="current-password" required></label>
          <button type="submit">Zaloguj</button>
        </form>
        <p class="admin-status" data-login-status></p>
      </section>

      <section class="admin-shell" data-admin-shell hidden>
        <div class="admin-toolbar">
          <div><strong>Panel redakcyjny</strong><span data-user-email></span></div>
          <button type="button" class="button-secondary" data-logout>Wyloguj</button>
        </div>

        <div class="admin-grid">
          <section class="admin-card">
            <h2 data-form-title>Nowy artykuł</h2>
            <form class="admin-form" data-article-form>
              <input type="hidden" name="id">
              <label>Tytuł<input type="text" name="title" maxlength="180" required></label>
              <label>Dział
                <select name="section" required>
                  <option value="Infrastruktura">Infrastruktura</option>
                  <option value="Śledztwa">Śledztwa</option>
                  <option value="Wydarzenia">Wydarzenia</option>
                  <option value="Społeczność">Społeczność</option>
                  <option value="Tajemnice">Tajemnice</option>
                  <option value="Opinie">Opinie</option>
                </select>
              </label>
              <label>Lead<textarea name="summary" rows="4" maxlength="600" required></textarea></label>
              <label>Treść<textarea name="content" rows="14" required></textarea></label>
              <label>Zdjęcie<input type="file" name="image" accept="image/*"></label>
              <label>Opis zdjęcia<input type="text" name="image_alt" maxlength="240"></label>
              <label>Data publikacji<input type="datetime-local" name="published_at" required></label>
              <label class="check-row"><input type="checkbox" name="featured"> Główny artykuł</label>
              <label>Status
                <select name="status">
                  <option value="draft">Szkic</option>
                  <option value="published">Opublikowany</option>
                </select>
              </label>
              <div class="admin-actions">
                <button type="submit">Zapisz artykuł</button>
                <button type="button" class="button-secondary" data-reset-form>Wyczyść</button>
              </div>
              <p class="admin-status" data-form-status></p>
            </form>
          </section>

          <section class="admin-card">
            <h2>Artykuły</h2>
            <div class="admin-list" data-admin-list></div>
          </section>
        </div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/supabase-config.js?v=1"></script>
  <script src="/admin.js?v=1"></script>
</body>
</html>
