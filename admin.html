<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Redakcja • Kronika 82</title>

  <link rel="icon" type="image/png" href="/assets/favicon.png?v=4">
  <link rel="stylesheet" href="/styles.css?v=4">
  <link rel="stylesheet" href="/mobile.css?v=5">
  <link rel="stylesheet" href="/front-final.css?v=18">
  <link rel="stylesheet" href="/newsletter.css?v=2">
  <link rel="stylesheet" href="/admin-dashboard.css?v=2">
</head>

<body>
  <div class="page admin-page">

    <header class="masthead-wrap admin-masthead">
      <a class="admin-back" href="/">← Strona główna</a>
      <h1 class="masthead">Redakcja</h1>
      <p class="tagline">Kronika 82</p>
    </header>

    <main>

      <section class="admin-card" data-login-panel>
        <h2>Logowanie</h2>
        <p class="admin-help">Panel redakcyjny Kroniki 82.</p>

        <form class="admin-form" data-login-form>
          <label>
            E-mail
            <input type="email" name="email" autocomplete="email" required>
          </label>

          <label>
            Hasło
            <input type="password" name="password" autocomplete="current-password" required>
          </label>

          <button type="submit">Zaloguj</button>
        </form>

        <p class="admin-status" data-login-status></p>
      </section>

      <section data-admin-shell hidden>

        <div class="admin-toolbar">
          <div>
            <strong>Panel redakcyjny</strong>
            <span>
              <span data-user-email></span>
              •
              <span data-user-role></span>
            </span>
          </div>

          <button
            type="button"
            class="button-secondary"
            data-logout
          >
            Wyloguj
          </button>
        </div>

        <div class="admin-dashboard-grid">

          <aside class="admin-dashboard-actions">

            <a
              class="admin-dashboard-action"
              href="/admin-article.html"
            >
              <strong>+ Nowy artykuł</strong>
              <span>Napisz i opublikuj nowy materiał</span>
            </a>

            <a
              class="admin-dashboard-action"
              href="/admin-video.html"
              data-video-action
              hidden
            >
              <strong>▶ Wideo strony głównej</strong>
              <span>Dodaj, zmień lub usuń film</span>
            </a>

            <a
              class="admin-dashboard-action"
              href="/admin-users.html"
              data-users-action
              hidden
            >
              <strong>👥 Redakcja</strong>
              <span>Autorzy, redaktorzy i uprawnienia</span>
            </a>

          </aside>

          <section class="admin-card admin-dashboard-articles">

            <div class="admin-dashboard-heading">
              <div>
                <span class="section-label">Kronika 82</span>
                <h2>Artykuły</h2>
              </div>

              <span
                class="admin-help"
                data-article-count
              ></span>
            </div>

            <div
              class="admin-list"
              data-admin-list
            ></div>

            <nav
              class="admin-pagination"
              aria-label="Strony artykułów"
            >
              <button
                type="button"
                class="button-secondary"
                data-page-prev
              >
                ← Poprzednia
              </button>

              <span data-page-info></span>

              <button
                type="button"
                class="button-secondary"
                data-page-next
              >
                Następna →
              </button>
            </nav>

          </section>

        </div>

      </section>

    </main>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/supabase-config.js?v=1"></script>
  <script src="/admin-dashboard.js?v=1"></script>
</body>
</html>
