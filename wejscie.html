<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >
  <meta
    name="robots"
    content="noindex,nofollow,noarchive"
  >

  <title>Dostęp • Kronika 82</title>

  <style>
    *{
      box-sizing:border-box;
    }

    body{
      min-height:100vh;
      margin:0;
      display:grid;
      place-items:center;
      padding:24px;
      background:#f4f0e8;
      color:#171717;
      font-family:Georgia,"Times New Roman",serif;
    }

    .gate{
      width:min(100%,460px);
      padding:42px 38px;
      background:#fffdf8;
      border:1px solid #aaa49a;
      box-shadow:0 18px 50px rgba(0,0,0,.09);
      text-align:center;
    }

    .kicker{
      margin:0 0 8px;
      font:700 12px/1.2 Arial,sans-serif;
      letter-spacing:.16em;
      text-transform:uppercase;
    }

    h1{
      margin:0;
      font-size:48px;
      line-height:.95;
    }

    .rule{
      width:100%;
      height:4px;
      margin:22px 0;
      border-top:1px solid #171717;
      border-bottom:1px solid #171717;
    }

    p{
      font-size:17px;
      line-height:1.5;
    }

    form{
      display:grid;
      gap:14px;
      margin-top:28px;
      text-align:left;
    }

    label{
      font:700 13px/1.3 Arial,sans-serif;
      text-transform:uppercase;
      letter-spacing:.05em;
    }

    input{
      width:100%;
      margin-top:7px;
      padding:13px 14px;
      border:1px solid #777;
      background:#fff;
      color:#111;
      font:16px Arial,sans-serif;
    }

    button{
      padding:13px 18px;
      border:1px solid #171717;
      background:#171717;
      color:#fff;
      font:700 15px Arial,sans-serif;
      cursor:pointer;
    }

    button:hover{
      background:#333;
    }

    .error{
      margin:0;
      padding:10px;
      background:#f7e1df;
      border:1px solid #a83227;
      color:#7c1811;
      font:700 14px Arial,sans-serif;
    }

    .note{
      margin-top:22px;
      color:#68635b;
      font-size:13px;
    }
  </style>
</head>

<body>
  <main class="gate">
    <p class="kicker">Gazeta rodzinna</p>

    <h1>Kronika 82</h1>

    <div class="rule"></div>

    <p>
      Dostęp do gazety jest ograniczony.
      Podaj wspólne hasło czytelników.
    </p>

    <p class="error" data-error hidden>
      Nieprawidłowe hasło.
    </p>

    <form
      method="post"
      action="/api/access"
    >
      <input
        type="hidden"
        name="next"
        value="/"
        data-next
      >

      <label>
        Hasło

        <input
          type="password"
          name="password"
          autocomplete="current-password"
          required
          autofocus
        >
      </label>

      <button type="submit">
        Wejdź do Kroniki
      </button>
    </form>

    <p class="note">
      Dostęp zostanie zapamiętany na tym urządzeniu
      przez około 30 dni.
    </p>
  </main>

  <script>
    const params=
      new URLSearchParams(location.search);

    const next=params.get('next');

    if(
      next &&
      next.startsWith('/') &&
      !next.startsWith('//')
    ){
      document.querySelector('[data-next]').value=next;
    }

    document.querySelector('[data-error]').hidden=
      params.get('error')!=='1';
  </script>
</body>
</html>
